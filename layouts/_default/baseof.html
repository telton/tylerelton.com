<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>

  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "rss" -}}
    <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
  {{ end -}}

  <link rel="stylesheet" href="/css/site.css">

  <!-- Open Graph / Twitter -->
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  {{ if .IsPage }}
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="{{ .Date.Format "2006-01-02" }}">
  {{ else }}
    <meta property="og:type" content="website">
  {{ end }}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⌘%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div class="site-header-inner">
        <a href="/" class="site-brand" aria-label="Home">tylerelton.com</a>
        <nav class="site-nav" aria-label="Primary">
          {{ range .Site.Menus.main }}
            <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          {{ end }}
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme">
            <span id="theme-label">light</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer-inner">
        <p class="footer-copy">{{ .Site.Params.author }} — {{ now.Format "2006" }}</p>
        <div class="footer-links">
          <a href="{{ .Site.Params.social.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="{{ .Site.Params.social.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="/index.xml">RSS</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="/js/theme.js"></script>
</body>
</html>
