baseURL = 'https://tylerelton.com'
locale = 'en-us'
title = 'Tyler Elton'

[params]
  author = 'Tyler Elton'
  description = 'Senior software engineer. Building in Go and Odin.'
  since = 2018
  currentFocus = 'Go / Odin'
  [params.social]
    github = 'https://github.com/telton'
    linkedin = 'https://www.linkedin.com/in/tyler-elton-56b054142/'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[menu]
  [[menu.main]]
    name = 'Writing'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    name = 'Projects'
    url = '/projects/'
    weight = 20
  [[menu.main]]
    name = 'About'
    url = '/about/'
    weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.highlight]
      style = 'github-dark'
      lineNos = true
      lineNumbersInTable = true
      noClasses = false
      tabWidth = 2
